<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuel Duel: Quick Launch</title>
    <link rel="icon" type="image/png" href="ydlogo2.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Righteous&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --gold: #f59e0b;
            --green: #22c55e;
            --blue: #38bdf8;
            --red: #f87171;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem 2.5rem;
            width: 100%;
            max-width: 480px;
        }
        h1 {
            font-family: 'Righteous', cursive;
            font-size: 1.6rem;
            margin-bottom: 0.25rem;
        }
        h1 span { color: var(--gold); }
        .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }

        .field { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }

        .player-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        input[type="range"] {
            flex: 1;
            accent-color: var(--gold);
            cursor: pointer;
        }
        .count-badge {
            background: var(--gold);
            color: #000;
            font-weight: 800;
            font-size: 1.1rem;
            border-radius: 8px;
            padding: 0.25rem 0.65rem;
            min-width: 2.5rem;
            text-align: center;
        }

        .names-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.6rem;
        }
        .name-chip {
            background: rgba(248,250,252,0.07);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.2rem 0.65rem;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .btn-go {
            width: 100%;
            padding: 1rem;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            font-family: 'Righteous', cursive;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            margin-top: 1.5rem;
            letter-spacing: 0.03em;
        }
        .btn-go:hover { background: #d97706; }
        .btn-go:active { transform: scale(0.98); }
        .btn-go:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .status {
            margin-top: 1.25rem;
            padding: 0.75rem 1rem;
            background: rgba(248,250,252,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--muted);
            min-height: 2.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .status.ok { color: var(--green); border-color: var(--green); }
        .status.err { color: var(--red); border-color: var(--red); }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.75rem 0 1.25rem;
        }
        .manual-section { }
        .manual-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.75rem; }
        .manual-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .input-room {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            width: 90px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700;
        }
        .btn-sm {
            padding: 0.5rem 0.9rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .btn-blue { background: var(--blue); color: #000; }
        .btn-blue:hover { background: #0ea5e9; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
        .btn-ghost:hover { border-color: var(--text); color: var(--text); }
    </style>
</head>
<body>
    <div class="panel">
        <h1>🎄 Yuel <span>Duel</span></h1>
        <p class="subtitle">Quick-launch a test session with one click</p>

        <div class="field">
            <label>Players</label>
            <div class="player-row">
                <input type="range" id="player-count" min="2" max="12" value="4" oninput="updateNames()">
                <div class="count-badge" id="count-display">4</div>
            </div>
            <div class="names-preview" id="names-preview"></div>
        </div>

        <button class="btn-go" id="btn-go" onclick="launch()">🚀 Launch Game</button>

        <div class="status" id="status">Pick a player count and hit Launch.</div>

        <hr class="divider">

        <div class="manual-section">
            <div class="manual-label">Already have a room? Open individual tabs:</div>
            <div class="manual-row">
                <input type="text" class="input-room" id="manual-room" placeholder="ABCD" maxlength="4" autocomplete="off">
                <button class="btn-sm btn-blue" onclick="openManualPlayers()">Open Players</button>
                <button class="btn-sm btn-ghost" onclick="openHost()">Host only</button>
            </div>
        </div>
    </div>

    <script>
        const db = connectGameDatabase();

        const NAMES = ['Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Henry', 'Ivy', 'Jack', 'Kate', 'Leo'];

        function getBase() {
            return window.location.origin + window.location.pathname.replace('test-multi-device.html', '');
        }

        function updateNames() {
            const n = parseInt(document.getElementById('player-count').value);
            document.getElementById('count-display').textContent = n;
            const preview = document.getElementById('names-preview');
            preview.innerHTML = NAMES.slice(0, n).map(name =>
                `<span class="name-chip">${name}</span>`
            ).join('');
        }

        function setStatus(msg, type = '') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status' + (type ? ' ' + type : '');
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            return Array.from({length: 4}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
        }

        async function launch() {
            const btn = document.getElementById('btn-go');
            btn.disabled = true;
            setStatus('⏳ Creating game in Firebase…');

            const playerCount = parseInt(document.getElementById('player-count').value);
            const roomCode = generateRoomCode();
            const hostId = 'host_' + Date.now();

            try {
                // Create game in Firebase
                await db.ref(`games/${roomCode}`).set({
                    hostId,
                    settings: { publicChips: false },
                    phase: 'lobby',
                    createdAt: Date.now(),
                    players: {},
                    gifts: {},
                    currentTurn: null
                });

                // Pre-seed host localStorage so host.html auto-rejoins via ?autoLoad=1
                localStorage.setItem('jingleBrawl_host_room', roomCode);
                localStorage.setItem('jingleBrawl_host_id', hostId);

                setStatus(`✅ Room ${roomCode} created, opening ${playerCount + 1} tabs…`, 'ok');

                // Small stagger so the browser doesn't block popups
                window.open(`${getBase()}host.html?autoLoad=1`, '_blank', 'noopener');
                for (let i = 1; i <= playerCount; i++) {
                    const name = NAMES[(i - 1) % NAMES.length];
                    const url = `${getBase()}player.html?room=${roomCode}&testId=${i}&name=${encodeURIComponent(name)}&autoJoin=1`;
                    setTimeout(() => window.open(url, '_blank', 'noopener'), i * 150);
                }

                setStatus(`✅ Room ${roomCode}: host + ${playerCount} player tabs opened!`, 'ok');
            } catch (err) {
                setStatus('❌ Error: ' + err.message, 'err');
            } finally {
                btn.disabled = false;
            }
        }

        function openHost() {
            window.open(`${getBase()}host.html`, '_blank', 'noopener');
        }

        function openManualPlayers() {
            const room = document.getElementById('manual-room').value.trim().toUpperCase();
            if (!room || room.length !== 4) { setStatus('Enter a 4-letter room code first.', 'err'); return; }
            const n = parseInt(document.getElementById('player-count').value);
            for (let i = 1; i <= n; i++) {
                const name = NAMES[(i - 1) % NAMES.length];
                setTimeout(() => {
                    window.open(`${getBase()}player.html?room=${room}&testId=${i}&name=${encodeURIComponent(name)}&autoJoin=1`, '_blank', 'noopener');
                }, i * 150);
            }
        }

        // Init
        updateNames();
    </script>
</body>
</html>
